<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PantryNotes Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; }
    </style>
</head>
<body>
    <!-- OG Image Template - 1200x630px -->
    <div style="width: 1200px; height: 630px; background-color: #2d5016; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden;">
        <!-- Subtle texture overlay -->
        <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 20%, rgba(58,102,35,0.6) 0%, transparent 60%), radial-gradient(ellipse at 80% 80%, rgba(15,30,7,0.4) 0%, transparent 50%);"></div>

        <div style="position: relative; z-index: 1; text-align: center; padding: 0 80px;">
            <!-- Subtitle label -->
            <p style="font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.2em; color: #ef9d6a; margin: 0 0 16px 0;">
                A personal cookbook
            </p>

            <!-- Main Title -->
            <h1 style="font-family: 'Playfair Display', serif; font-size: 72px; font-weight: 800; color: #faf8f5; margin: 0 0 24px 0; line-height: 1.1;">
                Pantry Notes
            </h1>

            <!-- Description -->
            <p style="font-family: 'Inter', sans-serif; font-size: 22px; color: rgba(250,248,245,0.7); margin: 0 0 48px 0; line-height: 1.6; max-width: 700px; display: inline-block;">
                Real recipes, kept for keeps. From quick weeknight meals to long, slow weekends.
            </p>

            <!-- Stats row -->
            <div style="display: flex; justify-content: center; align-items: center; gap: 48px;">
                <div style="text-align: center;">
                    <div style="font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; color: #faf8f5;">5+</div>
                    <div style="font-family: 'Inter', sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; color: rgba(250,248,245,0.5); font-weight: 600;">Recipes</div>
                </div>
                <div style="width: 1px; height: 32px; background-color: #4d8230;"></div>
                <div style="text-align: center;">
                    <div style="font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; color: #faf8f5;">Tested</div>
                    <div style="font-family: 'Inter', sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; color: rgba(250,248,245,0.5); font-weight: 600;">& Approved</div>
                </div>
                <div style="width: 1px; height: 32px; background-color: #4d8230;"></div>
                <div style="text-align: center;">
                    <div style="font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; color: #ef9d6a;">♨</div>
                    <div style="font-family: 'Inter', sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; color: rgba(250,248,245,0.5); font-weight: 600;">Made with love</div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #ef9d6a, #e8763f, #c4622d);"></div>
    </div>
</body>
</html>
